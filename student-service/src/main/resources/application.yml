  author: "Souryadeep"
logging:
  level:
    org:
      springframework:
        boot:
          devtools: DEBUG

server:
  address: 0.0.0.0
  port: 8080
grpc:
  server:
    name: Student-Service
    port: 9090
    enable-reflection: true
    certificateChain: classpath:server.crt
    privateKey: classpath:server.key