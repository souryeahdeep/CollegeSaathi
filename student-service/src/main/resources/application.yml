spring:
  security:
    user:
      name: user
      password: user
  application:
    name: Student-Service
  banner:
    location: classpath:banner.txt
  datasource:
    url: jdbc:postgresql://localhost:5432/Student
    username: postgres
    password: sourya3110
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
